name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/xenp-gfx.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/xeno-gfx.apk
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Xeno GFX ${{ github.event.inputs.tag_name || github.ref_name }}
          body: |
            ## Xeno GFX v1.1.0 — Cyberpunk Tactical Gaming Optimizer

            ### 🚀 What's New in this Release:
            - **Stitch Cyberpunk Tactical UI**: Void Obsidian glassmorphism design, real-time 4-pill diagnostic HUD (FPS, RAM, Temp, Ping), and 4-tab tactical navigation (`DASHBOARD`, `PRESETS`, `TELEMETRY`, `GAMES`).
            - **BGMI UE4 CVar XOR Codec (`0x79`)**: Reverse-engineered native `UserCustom.ini` hex encoder/decoder with custom graphic presets (Potato Zero-Lag 30 FPS, Smooth 60 FPS, Balanced 40 FPS, Competitive 90 FPS).
            - **GVAS Active.sav Binary Patcher**: Real-time binary patcher for UE4 save games unlocking FPS targets (`BattleFPS`, `FPSLevel`, `LobbyFPS`) without manual file hex editing.
            - **Scoped Storage SAF Bridge**: Full Android 11+ Storage Access Framework (`DocumentFile`) integration for accessing `Android/data/com.pubg.imobile/`.
            - **Gaming Session Tracker**: Records session duration, average FPS, min/max frame rates, stutter frequency (<27 FPS), and peak hardware temperatures.
            - **Aggressive RAM Turbo & Background Suppressor**: Evicts cached background hogs and suppresses waking processes every 30s during active gaming sessions.
            - **Floating Overlay HUD**: Low-overhead (<1% CPU) floating window with live telemetry and touch physics.

            *Standalone APK assets attached below.*
          files: |
            release-assets/xenp-gfx.apk
            release-assets/xeno-gfx.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
