name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/xenp-gfx.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/xeno-gfx.apk
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Xeno GFX ${{ github.event.inputs.tag_name || github.ref_name }}
          body: |
            ## Xeno GFX — Gaming Performance Toolkit

            ### Included Features:
            - **BGMI 4GB RAM Turbo**: Evicts cached apps to maximize available memory for BGMI.
            - **In-Game Background Suppressor**: Automatically suppresses waking background processes every 30s while gaming.
            - **Floating Compose HUD**: Real-time RAM, battery temperature, refresh rate, and ping.
            - **Auto Game Detector**: Automatic overlay trigger upon game launch.

            *Standalone APK asset attached below.*
          files: |
            release-assets/xenp-gfx.apk
            release-assets/xeno-gfx.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
