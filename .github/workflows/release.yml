name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/xenp-gfx.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/xeno-gfx.apk
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Xeno GFX ${{ github.event.inputs.tag_name || github.ref_name }}
          body: |
            ## Xeno GFX ${{ github.event.inputs.tag_name || github.ref_name }} — Titanium Telemetry Studio & Storage Access Engine

            ### 🚀 What's New in this Release:
            - **Titanium Telemetry Studio UI**: Redesigned from the ground up using Stitch. Frosted smoked glassmorphism, brushed titanium satin tactile surfaces, and a hardware-calibrated luxury palette (Obsidian, Titanium, Champagne Gold, Platinum Ice, Muted Emerald, Sapphire Mist, Subdued Amber) completely eliminating harsh neon colors.
            - **Storage Permission & EACCES Resolution**: Fixed UE4 config write permission denied errors (`open failed: EACCES`) with dual-path storage access supporting legacy storage permissions (`READ/WRITE/MANAGE_EXTERNAL_STORAGE`) on Android 8–10 and direct DocumentsProvider tree URI resolution on Android 11–15.
            - **Micro Telemetry Grid & Zero-Jitter Display**: Real-time render pacing (calibrated FPS), LPDDR5X free memory pools, cryo SoC thermals, and carrier latency with tabular monospace digits.
            - **BGMI UE4 CVar XOR Codec (0x79) & GVAS Active.sav Patcher**: Custom graphic presets (Potato Zero-Lag 30 FPS, Smooth 60 FPS, Balanced 40 FPS, Competitive 90 FPS) with automated UE4 save-game binary patching (`BattleFPS`, `FPSLevel`, `LobbyFPS`).
            - **One-Tap Turbo Launch Pipeline**: Aggressive RAM purge, instant UE4 configuration injection, persistent background process suppression, and game launch.
            - **Gaming Session Diagnostics**: Post-session analytics dialog with duration, average FPS, frame range, frame drop stutters, peak temperatures, and reclaimed memory.
            - **Low-Overhead Floating HUD**: Real-time in-game floating overlay with touch physics consuming <1% CPU.

            *Standalone APK assets attached below.*
          files: |
            release-assets/xenp-gfx.apk
            release-assets/xeno-gfx.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
